name: WordPress Plugin CI
on:
  push:
    branches: [main, "feature/**", "fix/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  php-compat:
    name: PHP compatibility ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax check
        run: find rar-wp-commerce-studio-ai tests -type f -name '*.php' -exec php -l {} \;
      - name: Offline plugin smoke tests
        run: php tests/smoke.php

  php-and-package:
    name: Validate and package plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Confirm release version metadata
        run: |
          grep -q 'Version: 0.1.1' rar-wp-commerce-studio-ai/rar-wp-commerce-studio-ai.php
          grep -q "const VERSION = '0.1.1';" rar-wp-commerce-studio-ai/rar-wp-commerce-studio-ai.php
      - name: PHP lint and smoke checks
        run: |
          find rar-wp-commerce-studio-ai tests -name '*.php' -print -exec php -l {} \;
          php tests/smoke.php
      - name: JavaScript syntax
        run: node --check rar-wp-commerce-studio-ai/assets/admin.js
      - name: Build installable WordPress plugin ZIP
        run: |
          zip -qr rar-wp-commerce-studio-ai.zip rar-wp-commerce-studio-ai
          unzip -l rar-wp-commerce-studio-ai.zip
          sha256sum rar-wp-commerce-studio-ai.zip > rar-wp-commerce-studio-ai.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rar-wp-commerce-studio-ai-plugin-zip
          path: |
            rar-wp-commerce-studio-ai.zip
            rar-wp-commerce-studio-ai.zip.sha256
          if-no-files-found: error

  publish-release:
    name: Publish v0.1.1 official release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [php-compat, php-and-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rar-wp-commerce-studio-ai-plugin-zip
      - name: Create verified GitHub Release (no prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.1 already exists; preserving tagged release."
            exit 0
          fi
          sha256sum -c rar-wp-commerce-studio-ai.zip.sha256
          gh release create v0.1.1 \
            rar-wp-commerce-studio-ai.zip \
            rar-wp-commerce-studio-ai.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RAR WP Commerce Studio AI v0.1.1" \
            --notes-file docs/RELEASE_NOTES_v0.1.1.md \
            --latest
